{% extends "base.html" %}{% block content %}<h1>Auditoría</h1><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Objeto</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.occurred_at|date:"d-m-Y H:i" }}</td><td>{{ event.actor|default:"Sistema" }}</td><td>{{ event.action }}</td><td>{{ event.target_type }} {{ event.target_id }}</td></tr>{% empty %}<tr><td colspan="4">Sin eventos.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
