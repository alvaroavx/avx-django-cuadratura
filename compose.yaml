services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuadratura}
      POSTGRES_USER: ${POSTGRES_USER:-cuadratura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuadratura-local-only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuadratura}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cuadratura_pgdata:/var/lib/postgresql/data
volumes:
  cuadratura_pgdata:

