[project]
name = "avx-cuadratura"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=5.2.16,<5.3",
  "psycopg[binary]>=3.2.9,<4",
  "openpyxl>=3.1.5,<4",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = ["coverage>=7.10,<8", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py314"

